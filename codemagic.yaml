workflows:
  ios-appstore:
    name: OMNI iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - APP_STORE
      vars:
        XCODE_WORKSPACE: "capacitor/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.omnitap.app"
      node: 22
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          cd capacitor
          npm install
      - name: Copy web assets to www/
        script: |
          cd capacitor
          mkdir -p www
          # Core app files from repo root
          cp ../index.html www/ 2>/dev/null || echo "no index.html"
          cp ../manifest.json www/ 2>/dev/null || echo "no manifest.json"
          cp ../sw.js www/ 2>/dev/null || echo "no sw.js"
          # Legal pages
          cp ../privacy.html www/ 2>/dev/null || echo "no privacy.html"
          cp ../terms.html www/ 2>/dev/null || echo "no terms.html"
          # Icons
          cp ../icon-192.png www/ 2>/dev/null || echo "no icon-192.png"
          cp ../icon-512.png www/ 2>/dev/null || echo "no icon-512.png"
          cp ../apple-touch-icon.png www/ 2>/dev/null || echo "no apple-touch-icon.png"
          # Native bridge (lives in capacitor/ folder)
          cp native-bridge.js www/ 2>/dev/null || echo "no native-bridge.js"
          echo "=== www/ contents ==="
          ls -la www/
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          echo "=== Fetching signing files for $BUNDLE_ID ==="
          # Use the persisted certificate private key from env vars
          # app-store-connect reads APP_STORE_CONNECT_ISSUER_ID,
          # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY from env
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" || echo "FETCH FAILED with exit code $?"
          echo "=== Checking what was downloaded ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "NO PROFILES DOWNLOADED"
          find ~/Library -name "*.mobileprovision" 2>/dev/null | head -5 || echo "no mobileprovision files found"
          echo "=== Installing certificates to keychain ==="
          # Find and import the .p12 certificate
          P12_FILE=$(find ~/Library -name "*.p12" 2>/dev/null | head -1)
          if [ -n "$P12_FILE" ]; then
            echo "Found certificate: $P12_FILE"
            # Import to login keychain (no password on the p12 from app-store-connect)
            security import "$P12_FILE" -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign 2>&1 || echo "import attempted"
            # Also try without password prompt
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ~/Library/Keychains/login.keychain-db 2>&1 || true
          else
            echo "No .p12 file found"
            find ~/Library -name "*.p12" 2>/dev/null || echo "no p12 files anywhere"
          fi
      - name: Add iOS platform and sync
        script: |
          cd capacitor
          echo "=== Capacitor version ==="
          npx cap --version
          echo "=== Adding iOS platform ==="
          npx cap add ios
          echo "=== cap add exit code: $?" 
          echo "=== ios directory contents ==="
          ls -la ios/ 2>/dev/null || echo "NO ios DIRECTORY"
          ls -la ios/App/ 2>/dev/null || echo "NO ios/App DIRECTORY"
          echo "=== Syncing ==="
          npx cap sync ios
      - name: Apply provisioning profiles to Xcode project
        script: |
          # First, ensure all downloaded profiles are in the standard location
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Finding all mobileprovision files ==="
          find ~/Library -name "*.mobileprovision" 2>/dev/null | while read f; do
            echo "Found: $f"
            # Get UUID and copy with UUID filename
            UUID=$(security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || echo "")
            if [ -n "$UUID" ]; then
              cp "$f" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
              echo "Installed as $UUID.mobileprovision"
            else
              # Fallback: copy with original name
              cp "$f" ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
            fi
          done
          echo "=== Provisioning profiles in standard location ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "no profiles dir"
          echo "=== Certificates ==="
          ls -la ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "no certs dir"
          # Find the .xcodeproj and apply profiles to it
          PROJECT=$(find capacitor/ios -name "*.xcodeproj" 2>/dev/null | head -1)
          echo "Applying profiles to: $PROJECT"
          xcode-project use-profiles --project "$PROJECT" || echo "use-profiles failed, continuing"

      - name: Set up CocoaPods
        script: |
          cd capacitor/ios/App
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "No Podfile found, skipping pod install"
          fi
      - name: Configure Info.plist usage descriptions
        script: |
          PLIST="capacitor/ios/App/App/Info.plist"
          # NFC
          /usr/libexec/PlistBuddy -c "Add :NFCReaderUsageDescription string 'OMNI uses NFC to share your contact card with a tap.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NFCReaderUsageDescription 'OMNI uses NFC to share your contact card with a tap.'" "$PLIST"
          # Face ID
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'OMNI uses Face ID to securely unlock your cards.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'OMNI uses Face ID to securely unlock your cards.'" "$PLIST"
          # Contacts
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string 'OMNI saves shared contacts to your phone.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSContactsUsageDescription 'OMNI uses NFC to share your contact card with a tap.'" "$PLIST"
          echo "=== Info.plist usage descriptions ==="
          /usr/libexec/PlistBuddy -c "Print :NFCReaderUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$PLIST"
      - name: Create export options plist
        script: |
          # Find all provisioning profiles and install them to standard location
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          find ~/Library -name "*.mobileprovision" 2>/dev/null | while read PROFILE_PATH; do
            echo "Installing profile: $PROFILE_PATH"
            # Copy with UUID as filename (xcodebuild expects this)
            UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin 2>/dev/null || echo "")
            if [ -n "$UUID" ]; then
              cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
              echo "Installed as $UUID.mobileprovision"
            else
              cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
            fi
          done
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          # Get profile name for export options
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles/ -name "*.mobileprovision" 2>/dev/null | head -1)
          PROFILE_NAME=""
          if [ -n "$PROFILE_PATH" ]; then
            PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin 2>/dev/null || echo "")
            echo "Profile name for export: $PROFILE_NAME"
          fi
          cat > /tmp/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>7R43JAU47W</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          echo "Export options plist created"

      - name: Build iOS app for App Store
        script: |
          # Find the actual .xcodeproj or .xcworkspace
          echo "=== Looking for iOS project ==="
          find capacitor/ios -name "*.xcodeproj" -o -name "*.xcworkspace" 2>/dev/null | head -10
          echo "=== ios/App contents ==="
          ls -la capacitor/ios/App/ 2>/dev/null || echo "no ios/App dir"
          # Try workspace first (excluding the internal project.xcworkspace), then project
          WORKSPACE=$(find capacitor/ios -name "*.xcworkspace" 2>/dev/null | grep -v "xcodeproj" | head -1)
          PROJECT=$(find capacitor/ios -name "*.xcodeproj" 2>/dev/null | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "Using workspace: $WORKSPACE"
            xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$XCODE_SCHEME" --export-options-plist /tmp/export_options.plist
          elif [ -n "$PROJECT" ]; then
            echo "Using project: $PROJECT"
            xcode-project build-ipa --project "$PROJECT" --scheme "$XCODE_SCHEME" --export-options-plist /tmp/export_options.plist
          else
            echo "ERROR: No .xcodeproj or .xcworkspace found!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

