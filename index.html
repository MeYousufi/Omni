<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMNI">
<title>OMNI</title>
<style>
:root{--bg:#090a0d;--card:#14161c;--line:#262a33;--text:#f5f6f8;--muted:#9aa1ad;--accent:#4f8cff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:480px;margin:0 auto;padding:22px 16px 48px}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand h1{margin:0;font-size:28px;letter-spacing:.14em;font-weight:700}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.08em}
select,input,textarea{width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#101218;color:var(--text);font:inherit}
textarea{min-height:68px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:650;margin:6px 6px 0 0}
button.gray{background:#2a2f3a}
label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
label:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;font:inherit;margin:0}
#qr{background:#fff;padding:10px;border-radius:12px;width:fit-content;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>OMNI</h1><span>SHARE ONLY WHAT YOU CHOOSE</span></div>
  <div class="box">
    <select id="pick"></select>
    <button id="add" class="gray">New profile</button>
  </div>
  <div class="box">
    <input id="label" placeholder="Profile name, e.g. Studio">
    <input id="name" placeholder="Name">
    <input id="org" placeholder="Business">
    <input id="title" placeholder="Title">
    <textarea id="phones" placeholder="Phones, one per line"></textarea>
    <textarea id="emails" placeholder="Emails, one per line"></textarea>
    <textarea id="urls" placeholder="Websites, one per line"></textarea>
    <button id="save">Save profile</button>
    <button id="del" class="gray">Delete</button>
  </div>
  <div class="box">
    <b>Send this person</b>
    <div class="muted">Uncheck anything they should not get.</div>
    <div id="fields"></div>
  </div>
  <div class="box">
    <pre id="preview">Nothing selected.</pre>
    <div id="qr"></div>
    <div>
      <button id="share">Share</button>
      <button id="vcf" class="gray">Save .vcf</button>
      <button id="link" class="gray">NFC / QR link</button>
    </div>
    <p class="muted">Share uses AirDrop, Messages, and Mail. NFC / QR link is what you write onto a tap sticker. For the iPhone “phones are close” prompt, keep your main contact in Contacts and leave NameDrop on.</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let profiles=JSON.parse(localStorage.getItem("omni")||"[]"), cur=0;
const blank=()=>({label:"New profile",name:"",org:"",title:"",phones:"",emails:"",urls:""});
if(!profiles.length) profiles=[blank()];
const saveAll=()=>localStorage.setItem("omni",JSON.stringify(profiles));
const lines=s=>(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
function fill(){
  const p=profiles[cur];
  ["label","name","org","title","phones","emails","urls"].forEach(k=>$(k).value=p[k]||"");
  $("pick").innerHTML=profiles.map((p,i)=>`<option value="${i}" ${i==cur?"selected":""}>${p.label||"Untitled"}</option>`).join("");
  const bits=[];
  if(p.org) bits.push(`<label><input type="checkbox" value="org" checked><span>Business<br><span class="muted">${p.org}</span></span></label>`);
  if(p.title) bits.push(`<label><input type="checkbox" value="title" checked><span>Title<br><span class="muted">${p.title}</span></span></label>`);
  lines(p.phones).forEach((v,i)=>bits.push(`<label><input type="checkbox" value="phone:${i}" checked><span>Phone<br><span class="muted">${v}</span></span></label>`));
  lines(p.emails).forEach((v,i)=>bits.push(`<label><input type="checkbox" value="email:${i}" checked><span>Email<br><span class="muted">${v}</span></span></label>`));
  lines(p.urls).forEach((v,i)=>bits.push(`<label><input type="checkbox" value="url:${i}" checked><span>Website<br><span class="muted">${v}</span></span></label>`));
  $("fields").innerHTML=bits.join("")||`<div class="muted">Add details, then save.</div>`;
  document.querySelectorAll("#fields input").forEach(el=>el.onchange=preview);
  preview();
}
function chosen(){
  const p=profiles[cur], on=[...document.querySelectorAll("#fields input:checked")].map(el=>el.value);
  return {name:p.name,org:on.includes("org")?p.org:"",title:on.includes("title")?p.title:"",
    phones:lines(p.phones).filter((_,i)=>on.includes("phone:"+i)),
    emails:lines(p.emails).filter((_,i)=>on.includes("email:"+i)),
    urls:lines(p.urls).filter((_,i)=>on.includes("url:"+i))};
}
function vcard(d){
  const e=s=>(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,");
  let c="BEGIN:VCARD\nVERSION:3.0\nFN:"+e(d.name||d.org||"OMNI")+"\n";
  if(d.org) c+="ORG:"+e(d.org)+"\n";
  if(d.title) c+="TITLE:"+e(d.title)+"\n";
  (d.phones||[]).forEach(p=>c+="TEL;TYPE=CELL:"+p+"\n");
  (d.emails||[]).forEach(x=>c+="EMAIL:"+x+"\n");
  (d.urls||[]).forEach(u=>c+="URL:"+u+"\n");
  return c+"END:VCARD";
}
function preview(){
  const d=chosen();
  $("preview").textContent=[d.name,d.title,d.org,...d.phones,...d.emails,...d.urls].filter(Boolean).join("\n")||"Nothing selected.";
}
$("save").onclick=()=>{const p=profiles[cur];["label","name","org","title","phones","emails","urls"].forEach(k=>p[k]=$(k).value.trim());saveAll();fill();};
$("add").onclick=()=>{profiles.push(blank());cur=profiles.length-1;saveAll();fill();};
$("del").onclick=()=>{if(profiles.length===1)profiles=[blank()];else profiles.splice(cur,1);cur=0;saveAll();fill();};
$("pick").onchange=e=>{cur=+e.target.value;fill();};
$("share").onclick=async()=>{
  const blob=new Blob([vcard(chosen())],{type:"text/vcard"});
  const file=new File([blob],"OMNI.vcf",{type:"text/vcard"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"OMNI"}); return; }
  }catch(e){}
  try{
    if(navigator.share){ await navigator.share({title:"OMNI",text:$("preview").textContent}); return; }
  }catch(e){}
  downloadVcf();
};
function downloadVcf(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([vcard(chosen())],{type:"text/vcard"}));
  a.download="OMNI.vcf";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
$("vcf").onclick=downloadVcf;
$("link").onclick=async()=>{
  const url="https://meyousufi.github.io/Omni/#c="+btoa(unescape(encodeURIComponent(JSON.stringify(chosen()))));
  let copied=false;
  try{ await navigator.clipboard.writeText(url); copied=true; }catch(e){}
  $("qr").style.display="block"; $("qr").innerHTML="";
  if(typeof QRCode!=="undefined"){ new QRCode($("qr"),{text:url,width:168,height:168}); }
  else{ $("qr").innerHTML="<p style='color:#000;padding:10px'>QR needs internet the first time it loads.</p>"; }
  if(copied) alert("OMNI link copied. Write it to an NFC sticker.");
  else prompt("Copy this OMNI link",url);
};
if(location.hash.startsWith("#c=")){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
    const href=URL.createObjectURL(new Blob([vcard(d)],{type:"text/vcard"}));
    document.body.innerHTML=`<div class="wrap"><div class="brand"><h1>OMNI</h1></div><div class="box"><h2 style="margin:0 0 8px">${d.name||"Contact"}</h2><pre>${[d.title,d.org,...(d.phones||[]),...(d.emails||[]),...(d.urls||[])].filter(Boolean).join("\n")}</pre><p><a href="${href}" download="OMNI.vcf" style="color:#9ec1ff">Save to Contacts</a></p></div></div>`;
  }catch(e){fill();}
}else fill();
</script>
</body>
</html>
